name: collect-candles

# Автосбор свечей с Binance в Postgres на Railway.
# Работает в облаке GitHub 24/7, независимо от домашнего ПК/NAS.
on:
  schedule:
    - cron: "5 * * * *"      # каждый час в :05 (UTC)
  workflow_dispatch: {}       # + возможность запустить вручную

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions запиннены по SHA, а не по плавающему тегу: тег переставляется, и
      # компрометация чужого репозитория action (сценарий tj-actions/changed-files)
      # означала бы чтение DATABASE_URL и PALANTIR_TOKEN прямо из окружения job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collector.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Падение сборщика уезжает в контур «Сигналы» Палантира.
          PALANTIR_TOKEN: ${{ secrets.PALANTIR_TOKEN }}
          PALANTIR_PRODUCT: binance-lab
